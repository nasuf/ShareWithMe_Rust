name: Backend CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_DIR: ${{ vars.RACKNERD_APP_DIR || '/app' }}
  SERVICE_NAME: ${{ vars.RACKNERD_SERVICE_NAME || 'sharewithme-backend' }}
  SHARE_WITH_ME_BIND: ${{ vars.SHARE_WITH_ME_BIND || '0.0.0.0:8080' }}

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --locked

  deploy:
    name: Deploy to RackNerd
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: cargo build --release --locked

      - name: Prepare release bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/tools dist/schema
          cp target/release/backend dist/sharewithme-backend
          cp package.json package-lock.json dist/
          cp tools/render_extract.mjs dist/tools/
          cp schema/sharewithme.sql dist/schema/

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RACKNERD_SSH_KEY }}

      - name: Trust RackNerd host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.RACKNERD_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release bundle
        run: |
          set -euo pipefail
          ssh "${{ secrets.RACKNERD_USER }}@${{ secrets.RACKNERD_HOST }}" "mkdir -p '${APP_DIR}'"
          rsync -az --delete --exclude '.env' --exclude 'media/' dist/ "${{ secrets.RACKNERD_USER }}@${{ secrets.RACKNERD_HOST }}:${APP_DIR}/"

      - name: Install service and restart
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/chat/completions' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SHARE_WITH_ME_API_TOKEN: ${{ secrets.SHARE_WITH_ME_API_TOKEN }}
          SHARE_WITH_ME_ASR_URL: ${{ vars.SHARE_WITH_ME_ASR_URL }}
          SHARE_WITH_ME_ASR_API_KEY: ${{ secrets.SHARE_WITH_ME_ASR_API_KEY }}
          SHARE_WITH_ME_ASR_MODEL: ${{ vars.SHARE_WITH_ME_ASR_MODEL || 'whisper-1' }}
          INSTAGRAM_OEMBED_TOKEN: ${{ secrets.INSTAGRAM_OEMBED_TOKEN }}
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
          BAIDU_MAPS_AK: ${{ secrets.BAIDU_MAPS_AK }}
        run: |
          set -euo pipefail
          ssh "${{ secrets.RACKNERD_USER }}@${{ secrets.RACKNERD_HOST }}" \
            "APP_DIR='${APP_DIR}' SERVICE_NAME='${SERVICE_NAME}' SHARE_WITH_ME_BIND='${SHARE_WITH_ME_BIND}' \
             DEEPSEEK_API_KEY='${DEEPSEEK_API_KEY}' DEEPSEEK_BASE_URL='${DEEPSEEK_BASE_URL}' \
             DEEPSEEK_MODEL='${DEEPSEEK_MODEL}' SUPABASE_DATABASE_URL='${SUPABASE_DATABASE_URL}' \
             SHARE_WITH_ME_API_TOKEN='${SHARE_WITH_ME_API_TOKEN}' \
             SHARE_WITH_ME_ASR_URL='${SHARE_WITH_ME_ASR_URL}' \
             SHARE_WITH_ME_ASR_API_KEY='${SHARE_WITH_ME_ASR_API_KEY}' \
             SHARE_WITH_ME_ASR_MODEL='${SHARE_WITH_ME_ASR_MODEL}' \
             INSTAGRAM_OEMBED_TOKEN='${INSTAGRAM_OEMBED_TOKEN}' \
             AMAP_WEB_SERVICE_KEY='${AMAP_WEB_SERVICE_KEY}' BAIDU_MAPS_AK='${BAIDU_MAPS_AK}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"
          chmod +x sharewithme-backend
          npm ci --omit=dev

          YTDLP_VERSION=2026.06.09
          YTDLP_SHA256=e5d57466682cfa9d61e9cf7c8a4f09b00f4a62af37d3bbdc4bcffdf63615feac
          if ! command -v yt-dlp >/dev/null 2>&1 || ! yt-dlp --version | grep -qx "$YTDLP_VERSION"; then
            curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp" -o /tmp/yt-dlp
            echo "$YTDLP_SHA256  /tmp/yt-dlp" | sha256sum -c -
            install -m 0755 /tmp/yt-dlp /usr/local/bin/yt-dlp
            rm -f /tmp/yt-dlp
          fi

          mkdir -p "$APP_DIR/media"

          cat > .env <<ENV
          SHARE_WITH_ME_BIND=$SHARE_WITH_ME_BIND
          SHARE_WITH_ME_STORE_BACKEND=supabase
          SHARE_WITH_ME_MEDIA=$APP_DIR/media
          SHARE_WITH_ME_RENDERER=$APP_DIR/tools/render_extract.mjs
          SHARE_WITH_ME_YTDLP=/usr/local/bin/yt-dlp
          SHARE_WITH_ME_API_TOKEN=$SHARE_WITH_ME_API_TOKEN
          SHARE_WITH_ME_ASR_URL=$SHARE_WITH_ME_ASR_URL
          SHARE_WITH_ME_ASR_API_KEY=$SHARE_WITH_ME_ASR_API_KEY
          SHARE_WITH_ME_ASR_MODEL=$SHARE_WITH_ME_ASR_MODEL
          INSTAGRAM_OEMBED_TOKEN=$INSTAGRAM_OEMBED_TOKEN
          AMAP_WEB_SERVICE_KEY=$AMAP_WEB_SERVICE_KEY
          BAIDU_MAPS_AK=$BAIDU_MAPS_AK
          DEEPSEEK_BASE_URL=$DEEPSEEK_BASE_URL
          DEEPSEEK_MODEL=$DEEPSEEK_MODEL
          DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
          SUPABASE_DATABASE_URL=$SUPABASE_DATABASE_URL
          ENV
          chmod 600 .env

          if command -v apt-get >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then
            apt-get update
            apt-get install -y chromium || apt-get install -y chromium-browser
          fi

          cat > "/etc/systemd/system/${SERVICE_NAME}.service" <<SERVICE
          [Unit]
          Description=ShareWithMe backend
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=$APP_DIR
          EnvironmentFile=$APP_DIR/.env
          ExecStart=$APP_DIR/sharewithme-backend
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable "$SERVICE_NAME"
          systemctl restart "$SERVICE_NAME"

          # The Supabase-backed startup can take longer than a couple of seconds,
          # so poll the health endpoint instead of a single fixed sleep.
          health_url="http://127.0.0.1:${SHARE_WITH_ME_BIND##*:}/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$health_url" >/dev/null; then
              echo "backend healthy after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "backend did not become healthy within 60s" >&2
              journalctl -u "$SERVICE_NAME" --no-pager -n 80 || true
              systemctl --no-pager --full status "$SERVICE_NAME" || true
              exit 1
            fi
            sleep 2
          done
          systemctl --no-pager --full status "$SERVICE_NAME"
          REMOTE
